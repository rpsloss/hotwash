name: hotwash
description: After-action review for coding-agent traces. Run a portable case suite.
author: rpsloss
inputs:
  path:
    description: Directory of cases (*.jsonl + *.expect.json). Defaults to cases/ in the caller repo.
    required: false
    default: cases
runs:
  using: composite
  steps:
    - name: Install hotwash
      shell: bash
      run: python3 -m pip install -q "$GITHUB_ACTION_PATH"
    - name: Eval
      shell: bash
      env:
        HOTWASH_CASES: ${{ inputs.path }}
      run: python3 -m hotwash --eval "$HOTWASH_CASES"
