[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hotwash"
version = "0.8.0"
description = "After-action review for coding-agent sessions. Local, deterministic, no cloud."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Ryan Sloss" }]
keywords = ["agents", "eval", "trace", "after-action", "llm"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/rpsloss/hotwash"
Issues = "https://github.com/rpsloss/hotwash/issues"

[project.scripts]
hotwash = "hotwash.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["hotwash*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
